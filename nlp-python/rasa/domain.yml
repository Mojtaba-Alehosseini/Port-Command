# Rasa domain — Port Command Genova (task 12).
# 10 intents, 8 entities — EXACTLY per PROJECT_DEFINITION.md 6.3. Do not add/rename.
#
# 2026-07-27 (task 26, decision b): 9 -> 10 intents. out_of_scope was added after the
# wild-set evaluation measured a 73.7% false-bind rate on turns whose correct answer is
# "ask a clarifying question": with no "none of these" label, DIET must spread a keyboard
# mash or a greeting over the nine in-domain intents and one of them wins. Entities are
# unchanged at 8.
version: "3.1"

intents:
  - propose_offer
  - counter_offer
  - accept_deal
  - reject_deal
  - query_status
  - set_constraint
  # set_policy is a ROUTING LABEL ONLY. When the Java confidence gate (task 14)
  # classifies an utterance as set_policy, it hands the RAW player text to
  # PolicyParser (task 10, regex-DSL) and INTENTIONALLY IGNORES any entities Rasa
  # extracted on this path. Rasa entities still matter for the other 8 intents.
  # (PROJECT_DEFINITION.md 6.3 note; planning/12 12.3.)
  - set_policy
  - request_help
  - cancel_action
  # out_of_scope is a ROUTING LABEL ONLY, like set_policy above. NLPPipeline maps it to
  # the clarification path — it never becomes an ACL performative, so it does not add an
  # 11th message type to the FIPA set. (Task 26 decision b.)
  - out_of_scope

entities:
  - vessel_name
  - vessel_class
  - berth_id
  - tug_name
  - time_expression
  - price_expression
  - cargo_class
  - hazmat_code

responses:
  utter_help:
    - text: "Available commands: propose a price, accept, reject, ask about vessel status, withdraw."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
